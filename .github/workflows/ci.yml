name: grafix checks
on:
  push:
  pull_request:
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Emit rustfmt changes for repository sync
        run: |
          cargo fmt --all
          node -e "const fs=require('node:fs'),cp=require('node:child_process');for(const path of cp.execSync('git diff --name-only',{encoding:'utf8'}).trim().split(String.fromCharCode(10)).filter(Boolean)){console.log('GRAFIX_FMT_JSON:'+JSON.stringify({path,content:fs.readFileSync(path,'utf8')}))}"
  rust:
    # The Gate A native renderer targets macOS; Linux winit needs X11/Wayland
    # features not included in the verified Bevy configuration.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test graph compiler
        run: cargo test --locked -p graph-core
      - name: Check native Bevy integration
        run: cargo check --locked -p graphics-cli
      - name: Check WebAssembly bridge
        run: cargo check --locked --target wasm32-unknown-unknown -p bridge-wasm
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked editor dependencies
        working-directory: apps/editor
        run: npm ci --no-audit --no-fund
      - name: Typecheck editor
        shell: bash
        run: |
          mkdir -p apps/editor/src/wasm-pkg
          cat > apps/editor/src/wasm-pkg/bridge_wasm.d.ts <<'EOF'
          export default function init(): Promise<void>;
          export function start(canvas: string, root: string): void;
          export function set_param(name: string, value: number): void;
          export function set_instancing(mode: string, count: number): void;
          export function set_animate_clones(animate: boolean): void;
          export function reset_camera(): void;
          export function telemetry(): string;
          export function param_schema(): string;
          export function graph_schema(): string;
          export function default_graph(): string;
          export function load_graph(json: string): void;
          export function set_node_param(id: string, key: string, value: number): void;
          EOF
          cd apps/editor
          npm run check
