[workspace]
resolver = "3"
members = [
  "crates/graph-core",
  "crates/graphics-shaders",
  "crates/graphics-gpu",
  "crates/graphics-bevy",
  "crates/bridge-wasm",
  "crates/graphics-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.lints.clippy]
# Bevy systems take their data as parameters; long signatures are idiomatic.
too_many_arguments = "allow"
type_complexity = "allow"

[workspace.dependencies]
graph-core = { path = "crates/graph-core" }
graphics-shaders = { path = "crates/graphics-shaders" }
graphics-gpu = { path = "crates/graphics-gpu" }
graphics-bevy = { path = "crates/graphics-bevy" }

# Bevy is pinned exactly. WebGL2 is deliberately NOT enabled: compute-driven
# effects need WebGPU, and the webgpu feature is the only web backend.
bevy = { version = "=0.20.1", default-features = false, features = [
  "default_app",
  "std",
  "web",
  "bevy_winit",
  "multi_threaded",
  "3d_bevy_render",
  "scene",
  "png",
  "webgpu",
] }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "console"] }
console_error_panic_hook = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
